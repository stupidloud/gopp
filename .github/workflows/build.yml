name: Manual Go Build
on:
  workflow_dispatch:
jobs:
  # 默认版：连接外部 PHP-FPM，纯 Go 静态编译
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload_step.outputs.artifact_url }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...
    - name: Build
      run: CGO_ENABLED=0 go build -v -trimpath -ldflags="-s -w" -o gopp .
    - name: Upload artifact to litterbox
      id: upload_step
      run: .github/scripts/upload.sh gopp

  # 内嵌 PHP 的单文件版（build-static.sh）
  build-static:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload_step.outputs.artifact_url }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Restore static-php-cli cache
      id: spc_cache
      uses: actions/cache/restore@v4
      with:
        # 只缓存编译结果，源码与下载包太大
        path: |
          .spc/spc
          .spc/buildroot
          .spc/libphp.stamp
        key: spc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-static.sh') }}
    - name: Test
      run: ./build-static.sh test
    - name: Build
      run: ./build-static.sh
    # libphp 编译完就保存，不受测试、编译或上传失败的影响（actions/cache 只在整个任务成功时保存）
    - name: Save static-php-cli cache
      if: always() && steps.spc_cache.outputs.cache-hit != 'true' && hashFiles('.spc/libphp.stamp') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          .spc/spc
          .spc/buildroot
          .spc/libphp.stamp
        key: ${{ steps.spc_cache.outputs.cache-primary-key }}
    - name: Upload artifact to litterbox
      id: upload_step
      run: .github/scripts/upload.sh gopp-static
